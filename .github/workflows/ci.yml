# Enforcement point for CONSTRAINTS.md. Every job here maps to a row in that
# file; if you change a threshold, change it there first.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches .nvmrc. commitlint, vitest and `node --experimental-strip-types`
  # all need >= 22.
  NODE_VERSION: "22"

jobs:
  verify:
    name: tipos, lint, unidad
    runs-on: ubuntu-latest
    # A push and a pull_request for the same branch would run this twice.
    # Keep the push run, and add the pull_request run only for forks, whose
    # commits never appear as a push on this repo.
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # check-floor and check-changed-coverage diff against the merge base,
          # which a shallow clone does not have.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Floor: these block.
      - name: piso (supresiones, tests skipped, stubs, excepciones)
        run: pnpm check:floor

      - name: política de idioma (código en inglés)
        run: pnpm check:language

      - name: tipos
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: formato
        run: pnpm format:check

      - name: datos del diccionario
        run: pnpm dictionary:check

      - name: tests unitarios con cobertura
        run: pnpm test:coverage

      # Warns while the team gets used to the number. Drop the --warn in
      # package.json to make it block; see CONSTRAINTS.md.
      - name: cobertura de líneas cambiadas
        run: pnpm check:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only chromium: it is the single project in playwright.config.ts.
      - run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself (webServer).
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: secretos y dependencias
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      # Pinned versions: a scanner that silently changes its rule set changes
      # the bar without anyone deciding to.
      - name: instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      # --redact keeps the matched secret out of the build log: without it a
      # leaked key leaks a second time, into a log anyone can read.
      - name: secretos (historial completo)
        run: gitleaks git . --redact --no-banner

      - name: instalar osv-scanner
        env:
          OSV_VERSION: v2.5.1
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      - name: vulnerabilidades en dependencias
        run: osv-scanner scan source -r .
